<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffcc00">
  <meta name="description" content="クイズで巡る東大本郷。クイズの正解と解説、文字を確認できます。">
  <title>正門から続く銀杏並木 | クイズで巡る東大本郷</title>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/config.js"></script>
  <script defer src="../js/progress.js"></script>
  <script defer src="../js/celebration.js"></script>
  <script defer src="../js/answer.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script defer src="../js/qr-scanner.js"></script>
  <script defer src="../js/exploration-map.js"></script>
  <script defer src="../js/guide.js"></script>
</head>
<body data-page-id="2">
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="文字一覧へ戻る">
        <span class="brand-mark" aria-hidden="true">?</span>
        <span class="brand-text"><small>Discover UTokyo Hongo with Quizzes</small><strong>クイズで巡る東大本郷</strong></span>
      </a>
      <button type="button" class="guide-toggle" aria-haspopup="dialog" aria-controls="quiz-guide">説明を見る</button>
    </header>
    <main id="main-content">
      <section class="answer-hero">
        <div class="answer-hero-copy">
          <h1 id="answer-title">正門</h1>
          <p>この場所にまつわるクイズの答えを見てみましょう。</p>
        </div>
        <img id="answer-illustration" src="../assets/images/avenue.svg" alt="" width="400" height="300">
      </section>
      <div id="answer-main" class="answer-content">
        <div class="answer-breadcrumb"><a href="../index.html">文字一覧</a><span aria-hidden="true"> / </span><span>正門</span></div>
        <p id="storage-warning" class="notice notice-warning" role="alert" hidden></p>
        <section class="answer-block question-block" aria-labelledby="question-heading">
          <span class="section-kicker">QUESTION</span>
          <h2 id="question-heading">問題をふり返る</h2>
          <p id="answer-question" class="question-text"></p>
        </section>
        <section class="answer-block correct-block" aria-labelledby="correct-heading">
          <span class="section-kicker">CORRECT ANSWER</span>
          <h2 id="correct-heading">正解</h2>
          <p id="answer-correct" class="correct-answer"></p>
          <h3>解説</h3>
          <p id="answer-explanation" class="explanation-text"></p>
        </section>
        <section class="unlock-panel" aria-labelledby="unlock-heading">
          <span class="section-kicker kicker-white">LETTER UNLOCKED</span>
          <h2 id="unlock-heading">文字を発見！</h2>
          <p id="answer-letter-number" class="unlocked-number">発見した文字</p>
          <div class="unlocked-letter"><span id="answer-keyword" aria-live="polite">…</span></div>
          <p><span id="answer-record-message">この文字を記録しました。記録した文字は文字一覧から確認できます。全部の文字を開放したら最終問題に挑戦！</span></p>
          <a class="primary-button" href="../index.html">文字一覧へ <span aria-hidden="true">→</span></a>
        </section>
      </div>
    </main>
    <footer class="site-footer"><div>クイズで巡る東大本郷<br>東京大学本郷いちょう遊歩学生ボランティア有志<br>東京大学本部社会連携推進課</div><a class="footer-home" href="../index.html"><span aria-hidden="true">← </span>文字一覧へ（トップ）</a></footer>
  </div>
  <noscript><p class="noscript">クイズの解説と文字を表示するには、JavaScriptを有効にしてください。</p></noscript>
</body>
</html>
